# Default motion settings for waist_updown_ros2.py.
# ROS 2 command-line parameters can still override these values at startup.

[motion]
# Vertical L3 tip travel distance, in metres (米 m).
distance_m = 0.3
# PTP speed as a fraction of the controller's max speed, in (0, 1].
# Lower = slower and smoother.  Start small (e.g. 0.05) and tune up.
speed_scale = 0.4
# NOTE: duration_s and publish_rate_hz were used by the old ServoJ streamer.
# In JOINT PTP mode the controller plans the motion, so they are now UNUSED
# (kept only so the file still parses).  distance_m + speed_scale are the
# effective knobs.
duration_s = 33.0
publish_rate_hz = 50.0
# Waist idle auto-power-off timeout, in seconds (秒 s).  Each updown command
# restarts this countdown; when it lapses with no new command the 5 body
# motors are powered off (they must not stay energized for long).  0 disables.
# iNex v1.0 fixed the body/arm power coupling (powering the body off no longer
# freezes the dual arms), so the watchdog can be re-enabled.  Keep 0.0 if the
# arms are driven by a client that also manages body power (see rokae-teleop).
idle_power_off_s = 0.0